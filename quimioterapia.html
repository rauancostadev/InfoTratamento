const grid = document.getElementById("protocolGrid");

function renderProtocols() {
    grid.innerHTML = "";
    Object.entries(quimioData).forEach(([categoria, itens]) => {
        const card = document.createElement("div");
        card.className = "card";
        
        const title = document.createElement("h2");
        title.textContent = categoria;
        card.appendChild(title);

        const ul = document.createElement("ul");
        itens.forEach(item => {
            const li = document.createElement("li");
            li.innerHTML = `
                <strong>${item.nome}</strong>
                <span class="intervalo">⏱️ Retorno: ${item.intervalo}</span>
                ${item.obs ? `<span class="badge-obs">⚠️ ${item.obs}</span>` : ''}
            `;
            ul.appendChild(li);
        });
        
        card.appendChild(ul);
        grid.appendChild(card);
    });
}

// Lógica de Busca
document.getElementById("search").addEventListener("input", e => {
    const value = e.target.value.toLowerCase();
    document.querySelectorAll(".card li").forEach(li => {
        const text = li.textContent.toLowerCase();
        li.style.display = text.includes(value) ? "block" : "none";
    });
    
    // Esconde cards vazios após a busca
    document.querySelectorAll(".card").forEach(card => {
        const hasVisibleItems = Array.from(card.querySelectorAll("li")).some(li => li.style.display !== "none");
        card.style.display = hasVisibleItems ? "block" : "none";
    });
});

renderProtocols();
